name: Generate reading sample image

# Run scripts/generate-sample.mjs from a GitHub Actions runner (which can
# reach api.openai.com — the local sandbox cannot). Commits the resulting
# .webp back to main, which auto-fires the deploy workflow.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Reading slug to generate (e.g. aura-reading). Use 'all' for every reading."
        required: true
        default: "aura-reading"
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so the auto-commit step can push back.
          fetch-depth: 0
          # Use the same PAT used by the deploy workflow so this job can push to main.
          token: ${{ secrets.PUBLIC_REPO_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install functions deps (sharp + form-data)
        run: |
          cd functions
          npm install --no-audit --no-fund

      - name: Generate sample
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is not set on this repository."
            echo "Add it at: Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          if [ "${{ inputs.slug }}" = "all" ]; then
            node scripts/generate-sample.mjs
          else
            node scripts/generate-sample.mjs "${{ inputs.slug }}"
          fi

      - name: Commit + push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/images/tools/; then
            echo "No image changes."
            exit 0
          fi
          git add public/images/tools/
          git commit -m "Real reading sample(s) for ${{ inputs.slug }} (auto-generated)"
          git push origin HEAD:main

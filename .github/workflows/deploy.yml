name: Deploy to GitHub Pages

# Updated workflow for deployment from private to public repo
# Triggering redeploy after secret update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo (source code)
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      
      - name: Install dependencies
        run: npm ci

      # Non-blocking quality gates. next build itself is configured to
      # ignore TS/ESLint errors (next.config.mjs) because there is a lint
      # backlog we have not yet burned down. Run the strict checks here
      # so regressions show up in the Actions tab. Drop continue-on-error
      # once `npm run lint` and `npx tsc --noEmit` are both clean — that
      # is the cue to also flip ignoreDuringBuilds / ignoreBuildErrors
      # to false in next.config.mjs.
      - name: Type-check (non-blocking)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Build with Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      
      - name: Prepare static files for GitHub Pages
        run: |
          # Ensure .nojekyll file exists
          touch out/.nojekyll
          
          # Ensure CNAME file exists and has correct content
          echo "storyincolor.com" > out/CNAME
          
          # List files for debugging
          echo "Contents of out directory:"
          ls -la out/
          
          # Copy 404 page if it exists
          if [ -f "public/404.html" ]; then
            cp public/404.html out/404.html
          fi
      
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: genaiguard/StoryInColor
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public-repo
      
      - name: Clean public repo
        run: |
          cd public-repo
          find . -mindepth 1 -not -path "./.git*" -delete
      
      - name: Copy built files to public repo
        run: |
          # Use out/. to ensure dotfiles are copied as well
          cp -r out/. public-repo/
          
          # Verify files were copied correctly
          echo "Contents of public-repo directory:"
          ls -la public-repo/
      
      - name: Commit and push to public repo
        run: |
          cd public-repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A  # Use -A to properly track file deletions
          git commit -m "Update GitHub Pages deployment [skip ci]" || echo "No changes to commit"
          git push 
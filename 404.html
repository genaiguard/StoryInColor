<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>StoryInColor - Redirecting...</title>
  <script>
    // Single Page App GitHub Pages Redirect Script
    // This handles routing for GitHub Pages with a custom domain
    (function() {
      // Redirect to the correct page
      var path = window.location.pathname;
      var redirectPath = path;

      // Preserve query parameters and hash
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      // Redirect to the homepage which will handle routing through Next.js
      window.location.href = '/' + search + hash;
    })();
  </script>
  <meta http-equiv="refresh" content="0;URL='/'">
  <meta name="robots" content="noindex">
</head>
<body>
  <p>Redirecting to the homepage...</p>
  <p><a href="/">Click here if you are not redirected automatically</a></p>
</body>
</html>
